<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090909" />
    <meta
      name="description"
      content="OpenMobile documentation for OpenPocketBase SDK, the Unreal Engine C++ and Blueprint client for PocketBase."
    />
    <link rel="icon" type="image/svg+xml" href="/openmobile-mark.svg" />
    <title>OpenPocketBase SDK | OpenMobile Docs</title>
    <script>
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("openmobile-theme");
        } catch {}
        const theme = saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#f5f2ed" : "#090909";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
